name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # The engine tests are plain C++ (no JUCE), but configuring the project
    # fetches JUCE for the plugin; macOS has what it needs out of the box.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build the engine tests
        run: cmake --build build --config Release --target dsp_tests -j 4
      - name: Run them
        run: ctest --test-dir build -C Release --output-on-failure

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build the engine (WebAssembly)
        run: tools/build_wasm.sh
      - name: Typecheck and build the site
        working-directory: web
        run: npx tsc --noEmit && npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist

  publish:
    # Publishes main's build to the `site` branch (just the built files, one
    # commit). Cloudflare Pages deploys that branch as-is: no build step and
    # no API token on this side.
    needs: [tests, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Push the build to the site branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
